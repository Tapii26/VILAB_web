# TIENDAS DE «DÓNDE COMPRAR» (/donde-comprar/)
# VI LAB no vende nada ni cobra comisión: cada botón abre la web de la tienda.
# - id: identificador (minúsculas) · nombre: como se muestra · tipo: digital | fisica
# - dominio: web a la que lleva (se muestra al usuario) · sigla: 1-2 letras del distintivo
# - ps5 / xbox: enlace directo a la ficha del juego (si falta, no sale el botón)
# - nota: frase corta opcional · orden: posición dentro de su grupo
# Revisa los enlaces de vez en cuando: las tiendas cambian sus URL. Última revisión: 2026-11-12.

