# Publica la web en Hostinger.
# Cada push a «main»: GitHub genera la web (npm run build) y guarda el resultado (dist/) en la rama «hostinger».
# Hostinger (hPanel → Avanzado → GIT) descarga la rama «hostinger» en public_html (con despliegue automático).
# No edites la rama «hostinger» a mano: se rehace en cada publicación.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Comprobar que la web está completa
        run: test -f dist/index.html && test -f dist/.htaccess && test -f dist/contacto.php

      - name: Guardar la web en la rama «hostinger»
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "Publicación"
